    <div class="share-buttons" data-aos="fade-down">

        <button id="shareLinkedIn" title="Share on LinkedIn" data-aos="fade-up" data-aos-delay="200"><img

    <div class="project-slideshow-container" data-aos="fade-up" data-aos-delay="200">

        <div class="project-nav project-prev">&#10094;</div>
        <div class="project-nav project-next">&#10095;</div>
        
        <!-- Project slides container -->
        <div class="project-slides"></div>
    </div>

    <div class="project-indicators" data-aos="fade-up" data-aos-delay="300"></div>
